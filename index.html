<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14111f">
<meta name="screen-orientation" content="landscape">
<title>라인 파티</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#07060c;color:#f1ecff;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#app{position:relative;width:960px;height:540px;flex:none;transform-origin:center center;background:radial-gradient(90% 90% at 50% 0%,#2c2248 0%,#16122a 55%,#0d0b16 100%);overflow:hidden;border-radius:6px}
#rotate{position:fixed;inset:0;background:#0d0b16;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:999;text-align:center;font-size:17px;padding:30px}
#rotate .ph{width:70px;height:110px;border:4px solid #ffc547;border-radius:12px;animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:820px){#rotate{display:flex}}
button{font-family:inherit;border:0;cursor:pointer;color:inherit;background:none}
.btn{background:linear-gradient(#ffcf5a,#f29b1d);color:#2a1600;font-weight:800;border-radius:12px;padding:10px 16px;font-size:16px;box-shadow:0 4px 0 #a65f00,0 6px 12px rgba(0,0,0,.4);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a65f00}
.btn.sub{background:linear-gradient(#5d5486,#3d3561);color:#f1ecff;box-shadow:0 4px 0 #262040,0 6px 12px rgba(0,0,0,.4)}
.btn.grn{background:linear-gradient(#7dffa1,#23a650);color:#062a12;box-shadow:0 4px 0 #11692f,0 6px 12px rgba(0,0,0,.4)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn:disabled{filter:grayscale(1) brightness(.6);pointer-events:none}
.screen{position:absolute;inset:0}
.res{display:flex;gap:8px;align-items:center}
.pill{background:#00000066;border:1px solid #ffffff1a;border-radius:16px;padding:4px 10px 4px 6px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:5px;min-width:70px}
.coin{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#f2b01e 60%,#a66d00);display:inline-block}
.gem{width:14px;height:14px;background:linear-gradient(135deg,#bff6ff,#3fb5ff 55%,#1a5fb0);transform:rotate(45deg) scale(.8);display:inline-block;border-radius:2px}
.trophy{width:14px;height:14px;display:inline-block;background:linear-gradient(#ffe38a,#d99a1a);clip-path:polygon(10% 0,90% 0,85% 40%,60% 60%,60% 80%,80% 80%,80% 100%,20% 100%,20% 80%,40% 80%,40% 60%,15% 40%)}
.topbar{position:absolute;top:0;left:0;right:0;height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:linear-gradient(#00000066,#0000)}
.back{background:#00000066;border-radius:10px;padding:7px 12px;font-size:14px;font-weight:700}
.badge{display:inline-block;background:#e0453a;color:#fff;border-radius:8px;font-size:10px;padding:1px 5px;margin-left:4px;vertical-align:2px;font-weight:800}
.panel{background:#ffffff0c;border:1px solid #ffffff1a;border-radius:14px;padding:10px}
.ptitle{font-size:13px;font-weight:900;color:#ffd667;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
/* lobby */
.lobby .left{position:absolute;left:12px;top:54px;width:228px;bottom:118px;display:flex;flex-direction:column;gap:8px}
.lobby .right{position:absolute;right:12px;top:54px;width:228px;bottom:118px;display:flex;flex-direction:column;gap:8px}
.lobby .center{position:absolute;left:252px;right:252px;top:50px;bottom:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.logo{font-size:44px;font-weight:900;letter-spacing:-2px;background:linear-gradient(#fff6d0,#ffc547 55%,#e2741b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #5a2a00) drop-shadow(0 6px 14px #000);line-height:1.1}
.parade{display:flex;gap:4px}
.parade .pt{width:56px;height:62px;border-radius:12px;overflow:hidden;animation:hop 1.6s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}30%{transform:translateY(-7px)}}
.league{display:flex;align-items:center;gap:10px;width:100%}
.lgem{width:46px;height:46px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;border:3px solid #fff3;box-shadow:inset 0 -6px 10px #0006}
.lbar{flex:1}
.lbar .nm{font-size:13px;font-weight:800}
.bar{height:10px;background:#00000080;border-radius:5px;overflow:hidden;margin-top:4px;position:relative}
.bar i{display:block;height:100%;background:linear-gradient(#ffe38a,#d99a1a)}
.bar.q i{background:linear-gradient(#7dffa1,#23a650)}
.fight{font-size:24px;padding:14px 46px;border-radius:16px}
.rowbtns{display:flex;gap:8px}
.quest{display:flex;align-items:center;gap:6px;font-size:12px;padding:5px 0;border-bottom:1px solid #ffffff10}
.quest:last-child{border:0}
.quest .qt{flex:1}
.quest .qp{font-size:11px;opacity:.75}
.event{background:linear-gradient(135deg,#ff5a8a33,#7a3fff33);border:1px solid #ff8ab055}
.event .en{font-weight:900;font-size:15px}
.event .ed{font-size:12px;opacity:.85;margin-top:2px}
.event .et{font-size:11px;opacity:.65;margin-top:4px}
.chests{position:absolute;left:12px;right:12px;bottom:10px;height:100px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.slot{border-radius:14px;background:#00000055;border:2px dashed #ffffff22;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;gap:2px;position:relative;overflow:hidden}
.slot.full{border:2px solid #ffffff33;background:#ffffff0d}
.slot.ready{border-color:#7dffa1;background:#7dffa11a;animation:glow3 1.2s infinite}
@keyframes glow3{50%{background:#7dffa133}}
.pt{overflow:hidden}
.pt img{width:100%;height:100%;object-fit:cover;object-position:50% 14%;display:block;pointer-events:none}
.cico{object-fit:contain;filter:drop-shadow(0 4px 6px #0008)}
.cico.open{filter:drop-shadow(0 0 18px #fff3a0) brightness(1.15)}
.slot .cico{width:64px;height:50px}
.slot .cn{font-weight:800}
.slot .ct{font-size:11px;opacity:.8}
.slot .cta{position:absolute;bottom:4px;right:6px;font-size:10px;color:#ffd667}
/* lists */
.body{position:absolute;top:50px;left:12px;right:12px;bottom:10px;overflow-y:auto}
.h2{font-size:18px;font-weight:900}
.stagegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stage{display:flex;align-items:center;gap:10px;background:#ffffff10;border:1px solid #ffffff18;border-radius:14px;padding:8px 10px;text-align:left}
.stage.locked{opacity:.35}
.stage .pt{width:44px;height:44px;flex:none;border-radius:50%;overflow:hidden}
.stage .nm{font-weight:800;font-size:13px}
.stage .ds{font-size:11px;opacity:.7;margin-top:2px}
.stage .ck{font-size:11px;color:#7dffa1;font-weight:800}
.herogrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.hcard{background:#ffffff0c;border:2px solid #ffffff18;border-radius:12px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.hcard.indeck{border-color:#ffc547;box-shadow:0 0 0 1px #ffc547}
.hcard.locked{opacity:.4}
.hcard .art{height:84px;position:relative}
.hcard .art .pt{position:absolute;inset:0;width:100%;height:100%}
.hcard .lvb{position:absolute;top:4px;left:4px;background:#000a;border-radius:6px;font-size:11px;font-weight:800;padding:1px 6px}
.hcard .dk{position:absolute;top:4px;right:4px;background:#c98a00;border-radius:6px;font-size:10px;font-weight:800;padding:1px 6px}
.hcard .inf{padding:5px 6px;font-size:11px;display:flex;flex-direction:column;gap:3px;flex:1}
.hcard .nm{font-weight:800;font-size:13px}
.hcard .cb{height:12px;background:#00000080;border-radius:6px;position:relative;overflow:hidden}
.hcard .cb i{display:block;height:100%;background:linear-gradient(#7fc8ff,#2f7fd6)}
.hcard .cb.ok i{background:linear-gradient(#7dffa1,#23a650)}
.hcard .cb b{position:absolute;inset:0;text-align:center;font-size:9px;line-height:12px;text-shadow:0 1px 2px #000}
.deckrow{display:flex;gap:6px;align-items:center;margin-bottom:10px}
.deckrow .ds{width:52px;height:58px;border-radius:9px;overflow:hidden;background:#00000055;border:1px dashed #ffffff33;position:relative}
.deckrow .ds .pt{width:100%;height:100%}
.shopgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.shopitem{background:#ffffff0c;border:1px solid #ffffff1a;border-radius:14px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.shopitem .cico{width:96px;height:76px}
.shopitem .nm{font-weight:900}
.shopitem .ds{font-size:11px;opacity:.75;min-height:30px}
/* battle */
.btop{position:absolute;top:0;left:0;right:0;height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:13px}
.btop .log{flex:1;text-align:center;font-weight:800;color:#ffd667}
.speed{background:#00000066;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700;margin-left:6px}
.bmid{position:absolute;top:40px;left:0;right:0;height:344px;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 10px}
.cmdp{width:132px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;position:relative}
.cmdp .pt{width:92px;height:92px;border-radius:50%;overflow:hidden;border:3px solid #ffffff55;box-shadow:0 0 0 4px #00000055}
.cmdp.e .pt{border-color:#ff7b6b88}
.cmdp.p .pt{border-color:#7fc8ff88}
.cmdp .nm{font-size:13px;font-weight:800;max-width:130px}
.cmdp .sub{font-size:11px;opacity:.75;color:#ff8aa8}
.hpbar{height:16px;width:118px;background:#00000080;border-radius:8px;overflow:hidden;position:relative}
.hpbar i{display:block;height:100%;background:linear-gradient(#ff7b6b,#d4322a);transition:width .3s}
.cmdp.p .hpbar i{background:linear-gradient(#7dffa1,#23a650)}
.hpbar b{position:absolute;inset:0;font-size:11px;text-align:center;line-height:16px;text-shadow:0 1px 2px #000}
.grid{display:grid;grid-template-columns:repeat(2,118px);grid-auto-rows:80px;gap:5px}
.lanecol{display:grid;grid-auto-rows:80px;gap:5px;width:16px}
.lanecol span{display:flex;align-items:center;justify-content:center;font-size:10px;opacity:.35;font-weight:800}
.cell{border-radius:11px;background:#ffffff08;border:1.5px dashed #ffffff22;position:relative}
.grid.e .cell{background:#ff4b4b0a}
.cell.valid{border:2px solid #ffd667;background:#ffd66722;animation:glow 1s infinite}
@keyframes glow{50%{background:#ffd66744}}
.cell.target{border:2px solid #ff6b6b;animation:glow2 .8s infinite}
@keyframes glow2{50%{background:#ff6b6b44}}
.unit{position:absolute;inset:0;border-radius:10px;overflow:hidden;border:2px solid #000;transition:transform .15s}
.unit .pt{position:absolute;inset:0;width:100%;height:100%}
.unit .st{position:absolute;top:1px;left:4px;font-size:11px;color:#ffd667;text-shadow:0 1px 2px #000;letter-spacing:-1px}
.unit .stat{position:absolute;bottom:2px;left:3px;right:3px;display:flex;justify-content:space-between}
.a,.h{min-width:22px;height:20px;border-radius:10px;font-size:12px;font-weight:900;text-align:center;line-height:20px;text-shadow:0 1px 2px #000;padding:0 4px}
.a{background:#d9821d}.h{background:#c22d3a}.h.hurt{background:#7a1520}
.unit .ic{position:absolute;top:2px;right:3px;display:flex;gap:2px}
.unit .ic span{font-size:9px;background:#000a;border-radius:6px;padding:1px 4px}
.unit.frozen{filter:hue-rotate(160deg) saturate(.6) brightness(1.2)}
.unit.e{border-color:#6e1b1b}.unit.p{border-color:#1b3e6e}
.lunge-r{transform:translateX(26px) scale(1.06)!important;z-index:5}
.lunge-l{transform:translateX(-26px) scale(1.06)!important;z-index:5}
.spawn{animation:spawn .35s}
@keyframes spawn{0%{transform:scale(1.5);opacity:0}100%{transform:scale(1);opacity:1}}
.hitfx{animation:hitfx .3s}
@keyframes hitfx{30%{filter:brightness(2.5)}}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.pop{position:absolute;pointer-events:none;font-weight:900;font-size:22px;color:#ff5e5e;text-shadow:0 2px 0 #000,0 0 6px #000;animation:pop .8s forwards;z-index:50;white-space:nowrap}
.pop.heal{color:#7dffa1}.pop.info{color:#9fd8ff;font-size:14px}
@keyframes pop{0%{transform:translate(-50%,0) scale(.6);opacity:0}20%{transform:translate(-50%,-14px) scale(1.2);opacity:1}100%{transform:translate(-50%,-44px) scale(1);opacity:0}}
.bbot{position:absolute;left:0;right:0;bottom:0;height:150px;display:flex;align-items:center;gap:12px;padding:8px 14px 12px}
.desc{width:250px;height:100%;font-size:12px;background:#00000055;border-radius:12px;padding:8px 10px;line-height:1.45;overflow:hidden}
.hand{flex:1;display:flex;gap:12px;justify-content:center;align-items:flex-end;height:100%}
.card{width:104px;height:122px;border-radius:12px;position:relative;overflow:hidden;border:2px solid #000;transition:transform .15s;flex:none}
.card .pt{position:absolute;inset:0;width:100%;height:100%}
.card .nm{position:absolute;top:auto;bottom:24px;left:0;right:0;font-size:11px;font-weight:800;text-align:center;background:#0008;padding:2px 0}
.card .stat{position:absolute;bottom:3px;left:3px;right:3px;display:flex;justify-content:space-between}
.card .st{position:absolute;top:18px;left:4px;font-size:12px;color:#ffd667;text-shadow:0 1px 2px #000}
.card.sel{transform:translateY(-10px);border-color:#ffd667!important;box-shadow:0 0 0 3px #ffd667,0 8px 20px #000}
.card.merged{animation:merged .7s}
@keyframes merged{0%{transform:scale(.5) rotate(-8deg)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.reel{width:104px;height:122px;border-radius:12px;background:#000;border:3px solid #ffc547;overflow:hidden;position:relative;box-shadow:inset 0 0 18px #000;flex:none}
.reel .pt{position:absolute;inset:0;width:100%;height:100%}
.reel.spin .pt{animation:blur .09s linear infinite}
@keyframes blur{0%{transform:translateY(-30%);filter:blur(2px)}100%{transform:translateY(30%);filter:blur(2px)}}
.bside{width:150px;height:100%;display:flex;flex-direction:column;justify-content:center;gap:8px}
.skillbtn small{display:block;font-size:10px;font-weight:600}
.banner{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:32px;font-weight:900;color:#ffd667;text-shadow:0 3px 0 #000,0 0 18px #000;pointer-events:none;animation:ban 1.1s forwards;z-index:40}
@keyframes ban{0%{transform:scale(.4);opacity:0}20%{transform:scale(1.1);opacity:1}80%{opacity:1}100%{opacity:0;transform:scale(1)}}
.modal{position:absolute;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:60}
.modal .box{background:linear-gradient(#2e2550,#1b1630);border:2px solid #ffc547;border-radius:18px;padding:18px 22px;width:460px;max-height:500px;text-align:center;display:flex;flex-direction:column;gap:10px}
.modal h3{font-size:26px;font-weight:900}
.modal .rw{font-size:14px;line-height:1.6}
.modal .btns{display:flex;gap:8px;justify-content:center}
.rules{text-align:left;font-size:12.5px;line-height:1.55;max-height:340px;overflow-y:auto}
.rules b{color:#ffd667}
.gotgrid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-height:260px;overflow-y:auto}
.got{width:76px;position:relative;animation:spawn .4s both}
.got .art{width:76px;height:84px;border-radius:10px;overflow:hidden;border:2px solid #fff3}
.got .art .pt{width:100%;height:100%}
.got .n{font-size:11px;margin-top:2px}
.got .x{position:absolute;top:2px;right:4px;font-weight:900;font-size:14px;text-shadow:0 1px 3px #000;color:#fff}
.chestbig{width:150px;height:114px;display:flex;justify-content:center;margin:0 auto;animation:wob .5s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) scale(1.04)}}
.toast{position:absolute;left:50%;top:60px;transform:translateX(-50%);background:#000d;border:1px solid #ffc547;border-radius:10px;padding:8px 14px;font-size:13px;z-index:80;animation:fade 1.6s forwards}
@keyframes fade{0%{opacity:0}10%,80%{opacity:1}100%{opacity:0}}
.t0{--tc:#c9d0da}.t1{--tc:#5fb0ff}.t2{--tc:#c77dff}.t3{--tc:#ffc04d}
.card.t0,.card.t1,.card.t2,.card.t3{border-color:var(--tc)}
.card.t2,.unit.t2{box-shadow:0 0 8px #c77dff99}
.card.t3,.unit.t3{box-shadow:0 0 12px #ffc04dcc}
.unit.t1:after,.unit.t2:after,.unit.t3:after{content:"";position:absolute;left:3px;top:15px;width:8px;height:8px;border-radius:50%;background:var(--tc);box-shadow:0 0 4px var(--tc);border:1px solid #000}
.herogrid{grid-template-columns:repeat(6,1fr)!important;gap:7px!important}
.hcard{border-color:var(--tc,#ffffff18)!important}
.hcard.t3{box-shadow:0 0 10px #ffc04d88}
.hcard.indeck{outline:2px solid #fff;outline-offset:-4px}
.hcard .art{height:78px!important}
.hcard .tn{font-size:10px;font-weight:800}
.hcard.unk{opacity:.75}
.hcard .upd{position:absolute;bottom:3px;right:3px;background:#23a650;border-radius:6px;font-size:10px;font-weight:900;padding:1px 6px;animation:glow3 1s infinite}
.deckrow .ds{border:2px solid var(--tc,#ffffff33)}
.got .art{border:2px solid var(--tc,#fff3)!important}
.got .newb{position:absolute;top:-6px;left:-4px;background:#e0453a;color:#fff;font-size:10px;font-weight:900;border-radius:6px;padding:1px 5px}
.modal .box.wide{width:620px}
.dwrap{display:flex;gap:16px;text-align:left}
.dart{width:170px;height:190px;flex:none;border-radius:14px;overflow:hidden;border:3px solid var(--tc)}
.dart.t3{box-shadow:0 0 18px #ffc04d}
.dinfo{flex:1;display:flex;flex-direction:column;gap:7px}
.dname{font-size:22px;font-weight:900}
.dstat{font-size:13px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.dsk{font-size:12px;line-height:1.5;background:#00000044;border-radius:10px;padding:7px 9px}
.dbtns{display:flex;flex-wrap:wrap;gap:6px}
.evoline{display:flex;align-items:center;justify-content:center;gap:6px}
.evo{width:66px;font-size:10px;font-weight:800;text-align:center;cursor:pointer}
.evo .art{width:66px;height:70px;border-radius:9px;overflow:hidden;border:2px solid var(--tc)}
.evo.cur .art{outline:2px solid #fff;outline-offset:1px}
.arr{font-size:22px;opacity:.6}
.evofx{display:flex;align-items:center;justify-content:center;gap:14px}
.evofx .art{width:120px;height:134px;border-radius:12px;overflow:hidden;border:3px solid var(--tc)}
.glowin{animation:glowin 1.2s ease-out}
@keyframes glowin{0%{transform:scale(.6);filter:brightness(4)}60%{transform:scale(1.08);filter:brightness(1.6)}100%{transform:scale(1)}}
.fe{position:absolute;top:2px;right:2px;width:17px;height:17px;object-fit:contain;filter:drop-shadow(0 1px 2px #000);z-index:2}
.unit .ic{top:20px!important}
.card .fe{width:20px;height:20px;top:3px;right:3px}
.fe2{position:absolute;bottom:3px;left:3px;width:18px;height:18px;object-fit:contain;filter:drop-shadow(0 1px 2px #000)}
.ci{width:15px;height:15px;object-fit:contain;vertical-align:-3px}
.syn{display:flex;gap:4px;margin-top:2px}
.chip{display:flex;align-items:center;gap:2px;background:#00000066;border:1.5px solid #ffffff22;border-radius:9px;padding:1px 5px 1px 3px;font-size:11px;cursor:pointer;opacity:.55}
.chip.lv1{opacity:1;border-color:var(--fc)}
.chip.lv2{opacity:1;border-color:var(--fc);background:color-mix(in srgb,var(--fc) 35%,#000);box-shadow:0 0 8px var(--fc)}
.ftabs{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.ftab{background:#00000055;border:1.5px solid #ffffff22;border-radius:9px;padding:4px 10px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:4px}
.ftab.on{border-color:var(--fc,#ffd667);background:#ffffff18}
.dsyn{margin-left:auto;font-size:12px;font-weight:800}
.battle.field{background:url(assets/bg_field.webp?v=6) center 30%/cover}
.battle.field:before{content:"";position:absolute;inset:0;background:linear-gradient(#0000 0%,#0000 71%,#0a0814e6 77%,#0a0814 100%);pointer-events:none}
.battle.field .btop{background:linear-gradient(#000a,#0000);z-index:3}
.battle.field .bmid{z-index:2}
.battle.field .bbot{z-index:3}
.battle.field .cmdp{background:#0008;border-radius:16px;padding:8px 4px;height:auto}
.battle.field .grid{grid-template-columns:repeat(2,114px);grid-auto-rows:78px;gap:6px 4px}
.battle.field .lanecol{grid-auto-rows:78px;gap:6px}
.battle.field .lanecol span{color:#fff;opacity:.5;text-shadow:0 1px 2px #000}
.battle.field .cell{background:none;border:0;overflow:visible;cursor:pointer}
.cell .tile{position:absolute;left:8%;right:8%;bottom:2px;height:34%;border-radius:50%;background:radial-gradient(ellipse at center,#ffffff30,#ffffff10 60%,#0000 72%);border:1.5px dashed #ffffff40}
.grid.e .cell .tile{background:radial-gradient(ellipse at center,#ff6b6b30,#ff6b6b10 60%,#0000 72%);border-color:#ff9a9a40}
.battle.field .cell.valid,.battle.field .cell.target{border:0!important}
.cell.valid .tile{border:2px solid #ffd667;background:radial-gradient(ellipse,#ffd66788,#ffd66722 70%,#0000 75%);animation:glow 1s infinite}
.cell.target .tile{border:2px solid #ff6b6b;background:radial-gradient(ellipse,#ff6b6b88,#0000 75%)}
.battle.field .unit{position:absolute;inset:0;border:0;border-radius:0;overflow:visible;pointer-events:none;box-shadow:none!important}
.battle.field .unit:after{display:none}
.unit .shadow{position:absolute;left:22%;right:22%;bottom:6px;height:12px;border-radius:50%;background:#0007;filter:blur(2px)}
.unit .ubody{position:absolute;left:50%;bottom:10px;width:112px;height:108px;margin-left:-56px;transform-origin:50% 100%;animation:idle 1.7s ease-in-out infinite}
@keyframes idle{0%,100%{transform:scaleY(1) translateY(0)}50%{transform:scaleY(.965) translateY(1px)}}
.unit .spr{width:100%;height:100%;object-fit:contain;object-position:50% 100%;filter:drop-shadow(0 2px 1px #0008)}
.unit.e .spr{transform:scaleX(-1)}
.unit.t2 .spr{filter:drop-shadow(0 0 5px #c77dffaa) drop-shadow(0 2px 1px #0008)}
.unit.t3 .spr{filter:drop-shadow(0 0 7px #ffc04d) drop-shadow(0 2px 1px #0008)}
.unit.frozen .spr{filter:hue-rotate(170deg) saturate(.5) brightness(1.4) drop-shadow(0 0 6px #9fe0ff)}
.battle.field .unit .stat{position:absolute;left:4px;right:4px;bottom:-6px;display:flex;justify-content:space-between;align-items:center;z-index:3}
.battle.field .unit .a,.battle.field .unit .h{min-width:22px;height:20px;line-height:20px;font-size:12px;border:1.5px solid #000a}
.unit .mid{display:flex;align-items:center;gap:1px;background:#000a;border-radius:8px;padding:0 4px 0 2px;height:16px}
.unit .mid .st{position:static;font-size:9px;color:#ffd667;letter-spacing:-1px}
.fe3{width:13px;height:13px;object-fit:contain}
.battle.field .unit .ic{position:absolute;top:auto!important;bottom:16px;right:2px;display:flex;flex-direction:column;gap:1px;z-index:3}
.battle.field .unit .ic span{font-size:9px;background:#000c;border-radius:6px;padding:0 4px}
.unit .fe{display:none}
.fxl{position:absolute;inset:0;pointer-events:none;z-index:30}
.proj{position:absolute;left:0;top:0;transform-origin:0 0}
.proj.arrow{width:30px;height:4px;margin:-2px 0 0 -15px;background:linear-gradient(90deg,#8a5a2a 0 70%,#e8e8f0 70%);border-radius:2px;box-shadow:0 0 3px #000}
.proj.dart{width:18px;height:4px;margin:-2px 0 0 -9px;background:linear-gradient(90deg,#7a5a2a,#7aff7a);border-radius:2px;box-shadow:0 0 6px #7aff7a}
.proj.fireball{width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:radial-gradient(circle at 60% 50%,#fff6b0,#ffb030 40%,#ff4a1a 75%,#0000 78%);box-shadow:0 0 16px #ff7a2a,-14px 0 12px #ff5a1a88}
.proj.ice{width:20px;height:10px;margin:-5px 0 0 -10px;background:linear-gradient(90deg,#e8faff,#7fd8ff);clip-path:polygon(0 50%,40% 0,100% 50%,40% 100%);filter:drop-shadow(0 0 5px #9fe0ff)}
.proj.spark{width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:radial-gradient(circle,#fff,#ffe14a 35%,#7fb4ff 60%,#0000 70%);box-shadow:0 0 18px #ffe14a}
.proj.orb{width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:radial-gradient(circle,#fff,#c77dff 50%,#0000 72%);box-shadow:0 0 12px #c77dff}
.burst{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:radial-gradient(circle,#fff8,#ffd66755 40%,#0000 70%);animation:burst .42s ease-out forwards}
.burst.fireball{background:radial-gradient(circle,#fff6b0,#ff8a2acc 40%,#0000 70%)}
.burst.ice{background:radial-gradient(circle,#ffffff,#9fe0ffcc 40%,#0000 70%)}
.burst.dart{background:radial-gradient(circle,#c9ffc9,#7aff7a88 40%,#0000 70%)}
.burst.spark{background:radial-gradient(circle,#ffffff,#ffe14acc 40%,#0000 70%)}
@keyframes burst{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.4);opacity:0}}
.slash{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:5px solid transparent;border-top-color:#fff;border-right-color:#fff8;animation:slash .36s ease-out forwards}
.slash.l{transform:scaleX(-1)}
@keyframes slash{0%{opacity:1;rotate:-60deg;scale:.6}100%{opacity:0;rotate:80deg;scale:1.3}}
.strike{position:absolute;width:14px;height:160px;margin:-150px 0 0 -7px;background:linear-gradient(#0000,#fff,#ffe14a);clip-path:polygon(40% 0,70% 0,55% 40%,80% 40%,30% 100%,45% 55%,20% 55%);filter:drop-shadow(0 0 10px #ffe14a);animation:strike .5s ease-out forwards}
@keyframes strike{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
.sparkle{position:absolute;width:50px;height:50px;margin:-25px 0 0 -25px;background:radial-gradient(circle,#c9ffd9,#7dffa166 40%,#0000 70%);border-radius:50%;animation:burst .7s ease-out forwards}
.dust{position:absolute;left:10%;right:10%;bottom:0;height:20px;border-radius:50%;background:radial-gradient(ellipse,#e8d8b8aa,#0000 70%);animation:burst .55s ease-out forwards;pointer-events:none}

const SAVE_KEY='lineparty_v2';
function dayKey(d){d=d||new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}
function defaultSave(){
  const owned={};START_OWNED.forEach(k=>owned[vid(k,HEROES[k].rar)]={lv:1,cards:0});
  return {v:3,gold:150,gems:30,owned,deck:START_OWNED.map(k=>vid(k,HEROES[k].rar)),trophies:0,bestLeague:0,cleared:0,
    chests:[{t:'wood',st:'ready'},null,null,null],cycle:0,
    quests:null,idle:{last:Date.now()},daily:{date:0,wins:0},shop:{date:0,free:false},stats:{w:0,l:0},seen:{}};
}
function loadSave(){
  try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));
    if(s&&s.v===2){const o={};Object.entries(s.owned).forEach(([k,v])=>{if(HEROES[k])o[vid(k,HEROES[k].rar)]=v});s.owned=o;s.deck=s.deck.filter(k=>HEROES[k]).map(k=>vid(k,HEROES[k].rar));s.v=3}
    if(s&&s.v===3)return s}catch(e){}
  return defaultSave();
}
let save=null;
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save))}catch(e){}}

let SPEED=1;
const sleep=ms=>new Promise(r=>setTimeout(r,ms/SPEED));
const rnd=n=>Math.floor(Math.random()*n);
const rr=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtT(sec){sec=Math.max(0,Math.ceil(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?`${h}시간 ${m}분`:m?`${m}분 ${s}초`:`${s}초`}
function todayEvent(){const d=new Date().getDay();return EVENTS.find(e=>e.days.includes(d))||null}
function ev(id){const e=todayEvent();return e&&e.id===id}
function leagueIdx(t){let i=0;LEAGUES.forEach((L,j)=>{if(t>=L.t)i=j});return i}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;app.appendChild(t);setTimeout(()=>t.remove(),1600)}

let actx=null;
function sfx(type){
  try{
    if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);
    const t=actx.currentTime;const P={tick:[880,.03,'square',.04],hit:[160,.12,'sawtooth',.12],place:[520,.1,'triangle',.12],heal:[700,.18,'sine',.1],win:[660,.5,'triangle',.15],lose:[200,.6,'sawtooth',.12],merge:[990,.3,'triangle',.14],cmd:[90,.25,'square',.15],coin:[1200,.12,'sine',.1]}[type]||[440,.1,'sine',.1];
    o.type=P[2];o.frequency.setValueAtTime(P[0],t);
    if(type==='win'||type==='merge'||type==='coin')o.frequency.linearRampToValueAtTime(P[0]*1.5,t+P[1]);
    if(type==='lose'||type==='cmd')o.frequency.linearRampToValueAtTime(P[0]*.5,t+P[1]);

        if(t){

          if(v.ex==='lifesteal'&&dealt>0){const h=Math.min(dealt,u.max-u.hp);if(h>0){u.hp+=h;fx.push({to:'u'+u.uid,k:'skill',sk:'lifesteal'});fx.push({to:'u'+u.uid,dmg:h,k:'heal'})}}
          if(v.ex==='plague')fx.push({to:'u'+u.uid,k:'skill',sk:'plague',wave:'poison',side:foe,lane:l});
          if(v.skill==='poison'){const tg=v.ex==='plague'?enemies:[t];tg.forEach(x=>{if(x.hp>0){x.poison=Math.max(x.poison,skillVal(u));fx.push({to:'u'+x.uid,txt:'독',k:'info',fxk:'poison'})}})}

          if(v.skill==='freeze'){const tg=v.ex==='blizzard'?enemies:[t];tg.forEach(x=>{if(x.hp>0){x.frozen=true;fx.push({to:'u'+x.uid,txt:'빙결',k:'info',fxk:'ice'})}})}

function colOk(id,r){const c=V(id).cls;if(c==='melee')return r<=1;if(c==='ranged'||c==='magic')return r>=1;return true}
function makePile(deck){const p=deck.slice();for(let i=p.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]]}return p}

/* ===================== AI ===================== */
function unitVal(st,u){return effAtk(st,u)*2+u.hp*.8+(u.armor?2:0)+(u.charges?2:0)-u.poison}
function threatOn(st,side){
  const foe=foeOf(side);let t=0;
  for(let l=0;l<LANES;l++){
    if(laneUnits(st,side,l).length)continue;
    for(let r=0;r<COLS;r++){const u=st.board[foe][r][l];if(u&&canAttack(st,u,r,l))t+=effAtk(st,u)}
    t+=1.2;
  }
  return t;
}
function evaluate(sim,before,side){
  const foe=foeOf(side);
  if(sim.cmd[foe].hp<=0)return 1e6;
  if(sim.cmd[side].hp<=0)return -1e6;
  const winning=before.cmd[side].hp>=before.cmd[foe].hp;
  let s=(before.cmd[foe].hp-sim.cmd[foe].hp)*(winning?4:2.2)-(before.cmd[side].hp-sim.cmd[side].hp)*3;
  let mine=0,theirs=0;eachUnit(sim,side,u=>mine+=unitVal(sim,u));eachUnit(sim,foe,u=>theirs+=unitVal(sim,u));
  s+=mine-theirs*(winning?1.1:1.6);
  s-=threatOn(sim,side)*(winning?1.6:2.4);
  eachUnit(sim,side,(u,r)=>{const c=V(u.key).cls;if(c==='melee'&&r===0)s+=.6;if((c==='ranged'||c==='magic')&&r===2)s+=.5;if(c==='support'&&r===2)s+=.6});
  return s;
}
function aiChoose(st,side,hand,noise){
  let best=null,bs=-Infinity;
  hand.forEach((card,hi)=>{for(const [r,l] of validCells(st,side,card)){
    const sim=structuredClone(st);place(sim,side,card,r,l);
    if(!sim.over)for(const _ of attackPhase(sim,side)){}
    const sc=evaluate(sim,st,side)+Math.random()*(noise||0);
    if(sc>bs){bs=sc;best={hi,r,l}}
  }});
  return best;
}

function ensureDaily(){
  const d=dayKey();
  if(!save.quests||save.quests.date!==d){
    const R=mulberry(d);const pool=QUEST_POOL.slice();const list=[];
    while(list.length<3){const i=Math.floor(R()*pool.length);list.push({id:pool[i].id,prog:0,claimed:false});pool.splice(i,1)}
    save.quests={date:d,list,bonus:false};
  }
  if(save.daily.date!==d)save.daily={date:d,wins:0};
  if(save.shop.date!==d)save.shop={date:d,free:false};
  persist();
}
function qp(id,n){ensureDaily();save.quests.list.forEach(q=>{if(q.id===id&&!q.claimed){const Q=QUEST_POOL.find(x=>x.id===id);q.prog=Math.min(Q.goal,q.prog+(n||1))}});persist()}

function unlockedBases(){const s=new Set(START_OWNED);for(let i=0;i<=save.bestLeague;i++)LEAGUES[i].un.forEach(b=>s.add(b));return [...s]}
function tierWeights(){const li=save.bestLeague;return [60,28+li*2,10+li*1.5,2+li*.6]}
function rollChest(t){
  const C=CHESTS[t];const pool=[];unlockedBases().forEach(b=>versionsOf(b).forEach(id=>pool.push(id)));
  let n=Math.round(C.cards*(ev('cards')?1.5:1));
  const TW=tierWeights();
  const pick=(minT)=>{const cand=pool.filter(id=>tierOf(id)>=(minT||0));const ws=cand.map(id=>TW[tierOf(id)]);const tot=ws.reduce((a,b)=>a+b,0);let x=Math.random()*tot;for(let i=0;i<cand.length;i++){x-=ws[i];if(x<=0)return cand[i]}return cand[0]};
  const got={};const add=(id,c)=>got[id]=(got[id]||0)+c;
  if(C.minRar){const id=pick(C.minRar);add(id,Math.max(1,Math.round(n*.15/(tierOf(id)+1))+1));}
  const kinds=rr(3,5);const parts=[];for(let i=0;i<kinds;i++)parts.push(pick());
  const PW=[1,.55,.3,.15];const pw=parts.map(id=>PW[tierOf(id)]);const ptot=pw.reduce((a,b)=>a+b,0);
  parts.forEach((id,i)=>add(id,Math.max(1,Math.round(n*pw[i]/ptot))));
  const gold=rr(C.gold[0],C.gold[1]),gems=rr(C.gems[0],C.gems[1]);
  const found=[];
  Object.entries(got).forEach(([id,c])=>{if(!save.owned[id]){save.owned[id]={lv:1,cards:0};found.push(id)}save.owned[id].cards+=c});
  save.gold+=gold;save.gems+=gems;persist();qp('chest');
  return {got,gold,gems,found};
}
function lvNeed(id){const o=save.owned[id];return Math.ceil(LV_CARDS[o.lv]*TIER_CARD_M[tierOf(id)])}
function lvGold(id){return Math.round(LV_GOLD[save.owned[id].lv]*TIER_GOLD_M[tierOf(id)])}

function evoInfo(id){
  const t=tierOf(id);if(t>=3)return {ok:false,max:true};
  const nx=vid(baseOf(id),t+1),E=EVO[t],o=save.owned[id];
  const r={nx,E,ok:false,why:''};
  if(save.bestLeague<EVO_LEAGUE)r.why=`${LEAGUES[EVO_LEAGUE].n} 리그부터 진화할 수 있어요`;
  else if(!save.owned[nx])r.why=`${V(nx).name}을(를) 상자에서 한 번 이상 얻어야 해요`;
  else if(!o||o.cards<E.need)r.why=`카드 ${o?o.cards:0}/${E.need}장`;
  else if(save.gold<E.gold)r.why=`골드 ${E.gold} 필요`;
  else r.ok=true;
  return r;
}
function doEvolve(id){const r=evoInfo(id);if(!r.ok)return false;track('evolve',{to:r.nx});save.owned[id].cards-=r.E.need;save.gold-=r.E.gold;save.owned[r.nx].cards+=r.E.get;persist();qp('evolve');return r}

let heroFilter='all';
function autoDeck(fac){
  const own=Object.keys(save.owned).filter(id=>!fac||V(id).fac===fac);
  const best={};own.forEach(id=>{const b=baseOf(id),sc=tierOf(id)*10+save.owned[id].lv;if(!best[b]||sc>best[b].sc)best[b]={id,sc}});
  let list=Object.values(best).sort((a,b)=>b.sc-a.sc).map(x=>x.id);
  const mel=list.filter(id=>V(id).cls==='melee'),rng=list.filter(id=>V(id).cls!=='melee');
  const deck=[];mel.slice(0,4).forEach(id=>deck.push(id));rng.slice(0,4).forEach(id=>deck.push(id));
  list.forEach(id=>{if(deck.length<8&&!deck.includes(id))deck.push(id)});
  let i=0;while(deck.length<8&&list.length&&i<20){const id=list[i%list.length];if(deck.filter(x=>x===id).length<2)deck.push(id);i++}
  if(deck.length<8){Object.keys(save.owned).forEach(id=>{if(deck.length<8&&!deck.includes(id))deck.push(id)})}
  return deck.slice(0,8);
}

  lobby:{bpm:92,chords:[[48,55,64],[45,52,60],[41,48,57],[43,50,59]],mel:[67,69,72,69,67,64,62,64,65,64,62,60,62,64,67,64]},
  battle:{bpm:128,chords:[[45,52,60],[41,48,57],[43,50,59],[40,47,55]],mel:[69,72,76,74,72,69,71,72,74,72,71,67,69,71,72,76]}
};
function mtof(n){return 440*Math.pow(2,(n-69)/12)}
function bgmNote(f,t,d,type,vol){const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(BGM.gain);o.start(t);o.stop(t+d+.05)}
function bgmTick(){
  if(!BGM.on||!actx)return;const S=BGM_SONGS[BGM.mode];const beat=60/S.bpm/2;const t=actx.currentTime+.05;const i=BGM.step++;
  const ch=S.chords[Math.floor(i/8)%S.chords.length];
  if(i%8===0)ch.forEach(n=>bgmNote(mtof(n),t,beat*7.5,'sine',.035));
  if(i%2===0)bgmNote(mtof(ch[0]-12),t,beat*1.6,'triangle',.06);
  if(i%2===1||BGM.mode==='battle')bgmNote(mtof(S.mel[i%S.mel.length]),t,beat*1.2,'square',.012);
  if(BGM.mode==='battle'&&i%4===0)bgmNote(90,t,.12,'sine',.08);
  BGM.timer=setTimeout(bgmTick,beat*1000);
}
function bgmStart(mode){
  if(save.mute)return;try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){return}
  if(!BGM.gain){BGM.gain=actx.createGain();BGM.gain.gain.value=.8;BGM.gain.connect(actx.destination)}
  if(BGM.on&&BGM.mode===mode)return;
  clearTimeout(BGM.timer);BGM.mode=mode;BGM.step=0;BGM.on=true;bgmTick();
}
function bgmStop(){BGM.on=false;clearTimeout(BGM.timer)}
function toggleMute(){save.mute=!save.mute;persist();if(save.mute)bgmStop();else bgmStart(screen==='battle'?'battle':'lobby');toast(save.mute?'소리 끔':'소리 켬')}

  ${cfg.mode==='arena'?(()=>{const li2=leagueIdx(save.trophies),L2=LEAGUES[li2],N2=LEAGUES[li2+1];const p0=N2?Math.max(0,(trB-L2.t)/(N2.t-L2.t)):1,p1=N2?(save.trophies-L2.t)/(N2.t-L2.t):1;return `<div class="rleague"><span style="color:${L2.c}">${L2.n} 리그</span><div class="bar"><i class="tb" style="width:${Math.min(100,p0*100)}%" data-to="${Math.min(100,p1*100)}"></i></div><span>${save.trophies}${N2?' / '+N2.t:''}</span></div>`})():''}${extra}
  ${cfg.mode==='arena'&&!win&&dT<0?`<button class="btn grn sm" id="rProt" ${adLeft('trophy')>0?'':'disabled'}>광고 보고 트로피 ${-dT} 돌려받기 (${adLeft('trophy')})</button>`:''}
  <div class="btns">${cfg.mode==='arena'?'<button class="btn" id="rAgain">다음 아레나</button>':cfg.mode==='stage'&&win&&cfg.idx+1<STAGES.length?'<button class="btn" id="rNext">다음 스테이지</button>':''}
  ${cfg.mode!=='arena'?'<button class="btn sub" id="rRetry">다시 하기</button>':''}<button class="btn sub" id="rHome">로비</button></div>`);
  m.querySelector('.box').classList.add('resbox');
  setTimeout(()=>{m.querySelectorAll('.cnt').forEach(e=>countUp(e,+e.dataset.v,700));const tb=m.querySelector('.tb');if(tb)tb.style.width=tb.dataset.to+'%'},350);
  bgmStop();
  const go=fn=>()=>{sfx('tick');m.remove();st=null;if(direct){const d=direct;direct=null;openChestModal(d,fn)}else fn()};
  const pr=m.querySelector('#rProt');if(pr)pr.onclick=()=>showRewardAd('trophy','이번 패배로 잃은 트로피를 돌려드려요',()=>{save.trophies-=dT;persist();pr.disabled=true;pr.textContent='트로피를 돌려받았어요';toast('트로피 복구!')});
  const a=m.querySelector('#rAgain');if(a)a.onclick=go(startArena);
  const n=m.querySelector('#rNext');if(n)n.onclick=go(()=>startStage(cfg.idx+1));
  const r=m.querySelector('#rRetry');if(r)r.onclick=go(()=>cfg.mode==='stage'?startStage(cfg.idx):startDaily());
  m.querySelector('#rHome').onclick=go(showLobby);
}

/* ===================== 테스트용 (콘솔) ===================== */
window.__simulate=function(n,stageIdx,eNoise){
  const S=STAGES[stageIdx||0];const eD=S.deck.map(b=>toVid(b,S.t||0));const elv={};eD.forEach(k=>elv[k]=S.lv);let pw=0,ew=0,rounds=0,errs=0;
  const plv=playerLvs();
  for(let g=0;g<n;g++){try{
    const s=newState({eHp:S.hp});const pH=[],pP=makePile(save.deck),eH=[],eP=makePile(eD);
    while(!s.over){
      startTurnEffects(s,'p');if(s.over)break;
      refill(pH,pP,plv);let p=aiChoose(s,'p',pH,2);if(p){const cc=pH.splice(p.hi,1)[0];pP.push(cc.key);place(s,'p',cc,p.r,p.l)}
      if(!s.over)for(const _ of attackPhase(s,'p')){}if(s.over)break;
      startTurnEffects(s,'e');if(s.over)break;
      refill(eH,eP,elv);p=aiChoose(s,'e',eH,eNoise??2);if(p){const cc=eH.splice(p.hi,1)[0];eP.push(cc.key);place(s,'e',cc,p.r,p.l)}
      if(!s.over)for(const _ of attackPhase(s,'e')){}if(s.over)break;
      s.round++;if(s.round>MAX_ROUND){s.over=true;s.timeout=true}
    }
    rounds+=s.round;const pr=s.cmd.p.hp/s.cmd.p.max,er=s.cmd.e.hp/s.cmd.e.max;
    if(s.cmd.e.hp<=0||(s.timeout&&pr>er))pw++;else ew++;
  }catch(e){errs++;console.error(e)}}
  return {playerWins:pw,enemyWins:ew,avgRounds:+(rounds/n).toFixed(1),errors:errs};
};
save=loadSave();if(!save.warlord)save.warlord='asten';if(!save.wl)save.wl={};checkLeagueUnlock();if(save.tut===undefined)save.tut=(save.stats.w+save.stats.l===0)?{}:null;persist();
addEventListener('pointerdown',()=>{if(!BGM.on&&!save.mute)bgmStart(screen==='battle'?'battle':'lobby')},{once:true});
(function preload(){window.__imgs=[];Object.keys(HEROES).forEach(b=>versionsOf(b).forEach(id=>{const i=new Image();i.src="assets/"+artOf(id)+".webp?v="+ASSET_V;__imgs.push(i)}));[...new Set(Object.values(CMD_ART))].forEach(k=>{const i=new Image();i.src="assets/c_"+k+".webp?v="+ASSET_V;__imgs.push(i)});["wood","silver","gold","boss"].forEach(k=>{const i=new Image();i.src="assets/x_"+k+".webp?v="+ASSET_V;__imgs.push(i)});FAC_KEYS.forEach(k=>{const i=new Image();i.src="assets/f_"+k+".webp?v="+ASSET_V;__imgs.push(i)});Object.keys(HEROES).forEach(b=>versionsOf(b).forEach(id=>{const i=new Image();i.src="assets/s_"+id+".webp?v="+ASSET_V;__imgs.push(i)}));{const i=new Image();i.src="assets/bg_field2.webp?v=16";__imgs.push(i)}["bg_lobby","bg_map","k_c_player","k_w_seraphine","k_w_orwan","k_w_maya","k_w_kardum","k_w_nox","k_c_rival1","k_c_rival2","k_c_goblin","k_c_swamp","k_c_beast","k_c_elf","k_c_flame","k_c_ice","k_c_knightc","k_c_storm","k_c_grave","k_c_dragonl","k_c_boss","k_c_boss2","k_c_boss3","k_c_boss4","w_seraphine","w_orwan","w_maya","w_kardum","w_nox","c_boss2","c_boss3","c_boss4","i_battle","i_map","i_boss","i_hero","i_shop","i_quest","i_gift","i_trophy","i_gem","i_coin","i_bolt","i_crate"].forEach(n=>{const i=new Image();i.src="assets/"+n+".webp?v="+ASSET_V;__imgs.push(i)});})();
ensureDaily();showLobby();
